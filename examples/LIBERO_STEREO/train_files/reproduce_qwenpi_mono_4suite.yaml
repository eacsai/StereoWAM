# ---------------------------------------------------------------------
# Reproduce starVLA paper Table 2 — Qwen3-vl-PI (joint mono 4-suite)
# ---------------------------------------------------------------------
# Goal: reproduce paper's 30K-step / 9.54-epoch joint training on all 4
# LIBERO suites for a single QwenPI (mono) policy, target avg 95.7%
# success rate.
#
# Differences from paper:
#   * VLM backbone is Qwen3.5-0.8B (we already have it locally), paper
#     used Qwen3-VL. Smaller backbone → numbers will likely be a bit
#     lower (range 90-93% expected) but pipeline is the equivalent.
#   * Data: we reuse the team's HDF5-state-replay self-rendered dataset
#     (bit-exact to LIBERO HDF5 source); dataloader loads [primary,
#     wrist] via libero_franka config (right_view auto-ignored). This
#     is equivalent to IPEC-COMMUNITY's lerobot-format release because
#     both derive from the same LIBERO HDF5 mujoco state replay.
#   * Effective batch sized for ~2.88 epochs (vs paper 9.54). Budget
#     constraint — middle tier per agreed plan; can extend later.
# ---------------------------------------------------------------------

run_id: reproduce_qwenpi_primary_only_0518
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: reproduce_qwen3pi
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    # Self-rendered LIBERO data (HDF5 state-replay, bit-exact). Symlink
    # at this relative path now points to /data/wangqiwei/ICLR2026/data/
    # libero_stereo_selfrender (Phase A of data reorg).
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_STEREO_DATA
    # 4-suite joint, uses libero_franka config [primary, wrist]
    # (right_view present in data files but ignored by config).
    data_mix: libero_all_mono_replay
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 8
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 30000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100000
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''  # unfrozen: train VLM + action expert (matches official PI ckpt actual behavior despite their buggy 'freeze_modules: true')
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
