# Monocular baseline (FAIR comparison vs SSF)
# ---------------------------------------------------------------------
# Trains the original starVLA-π (QwenPI, no SSF) on the SAME pixel
# inputs the SSF run will see: the *left view* of our replay-rendered
# stereo dataset. The mono `libero_franka` data config naturally loads
# only video.primary_image + video.wrist_image, ignoring right_view.
#
# This isolates SSF's contribution to a single variable: "model has
# access to right_view in training or not". Everything else (renderer,
# trajectory replay, mp4 encoding, train hyperparams) is identical to
# ssf_libero.yaml.
#
# Pair with examples/LIBERO_STEREO/train_files/ssf_libero.yaml as the
# apples-to-apples SSF ablation.
# ---------------------------------------------------------------------

run_id: mono_qwenpi_libero_spatial_replay   # distinct run_id for wandb
run_root_dir: playground/Checkpoints
seed: 42
wandb_entity: your_wandb_entity
wandb_project: llavavla
is_debug: false
version_id: "0.21"

framework:
  name: QwenPI                              # ← mono baseline (no SSF)
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3.5-0.8B
    attn_implementation: flash_attention_2
    vl_hidden_dim: 2048
  action_model:
    action_dim: 7
    state_dim: 7
    action_horizon: 8

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen2.5vl
    per_device_batch_size: 4

  vla_data:
    dataset_py: lerobot_datasets
    # FAIR: point at the SAME stereo data root SSF uses
    data_root_dir: playground/Datasets/LEROBOT_LIBERO_STEREO_DATA
    # FAIR: this mix loads ONLY left + wrist (libero_franka mono config)
    data_mix: libero_spatial_mono_replay
    action_type: delta_qpos
    sequential_step_sampling: False
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    per_device_batch_size: 16
    load_all_data_for_training: true
    video_backend: torchvision_av

trainer:
  max_train_steps: 100000
  num_warmup_steps: 5000
  save_interval: 5000
  eval_interval: 100
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: 'qwen_vl_interface'
  loss_scale:
    vla: 1.0
    vlm: 0.1
  max_grad_norm: 1.0
  weight_decay: 0.0
  logging_frequency: 10
  gradient_clipping: 1.0
  gradient_accumulation_steps: 4
  gradient_checkpointing: true

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08
